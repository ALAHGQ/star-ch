<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>تحدي الصفوف - صيد النجوم</title>
<style>
:root{--bg:#013699;--card:#0a2f84;--gold:#F3AB01;--gr:#0f9d58}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:#fff;font-family:Tahoma,Arial,sans-serif;text-align:center;touch-action:none}
.scr{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));gap:10px;overflow:auto;
background:linear-gradient(180deg,#012a78,#0a46b8)}
.scr.on{display:flex}
#s1::before{content:"";position:absolute;top:0;left:0;right:0;height:10px;background:linear-gradient(90deg,#013699,#E4B80A,#F3AB01)}
h1{margin:0;font-size:clamp(26px,5vw,40px);color:var(--gold)}
.sub{font-size:clamp(14px,2.5vw,18px);opacity:.95}
.logo{max-height:clamp(90px,20vh,160px);max-width:60vw;object-fit:contain;background:#fbf3d5;border-radius:20px;padding:8px;border:3px solid #E4B80A;box-shadow:0 6px 18px #0006}
.box{background:var(--card);border-radius:18px;padding:14px;width:100%;max-width:400px;border:2px solid var(--gold)}
.row{display:flex;gap:8px}
select,input{width:100%;padding:12px;margin:5px 0;border-radius:12px;border:0;font-size:17px;font-family:inherit;text-align:center;background:#fff;color:#111;user-select:text;-webkit-user-select:text}
button{background:var(--gold);color:#222;border:0;border-radius:16px;padding:14px 34px;font-size:clamp(18px,3vw,24px);font-weight:bold;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #b8850c}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8850c}
button.g{background:var(--gr);color:#fff;box-shadow:0 4px 0 #0a6b3b}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:14px;max-width:420px}
.legend span{display:flex;align-items:center;gap:4px}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%}
#game{padding:0;display:none;background:#0a2a6b}
#game.on{display:block}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:max(6px,env(safe-area-inset-top));left:8px;right:8px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:clamp(16px,3vw,24px);font-weight:bold;text-shadow:0 2px 4px #000;pointer-events:none}
#hud span{background:rgba(1,26,90,.72);border:2px solid rgba(243,171,1,.7);border-radius:16px;padding:4px 12px;box-shadow:0 3px 10px #0006}
#mute{pointer-events:auto;padding:6px 12px;font-size:20px;box-shadow:none;border-radius:12px;background:#ffffff33;color:#fff}
.big{font-size:clamp(54px,12vw,90px);color:var(--gold);font-weight:bold;line-height:1}
.st{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;font-size:17px}
.st div{background:#0a2a6b;border-radius:10px;padding:6px}

/* ===== ستايل القوائم الجديد ===== */
.scr{background-color:#012a78;background-size:cover;background-position:center bottom;justify-content:safe center;gap:12px}
#s1::before{display:none}
.box{background:rgba(1,24,86,.68);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:2px solid rgba(243,171,1,.85);border-radius:26px;padding:16px;box-shadow:0 12px 32px #0009,inset 0 0 0 1px #ffffff26}
.box select,.box input{background:rgba(255,255,255,.96);border-radius:16px;box-shadow:inset 0 2px 5px #0003;font-weight:bold;color:#0a2a77;border:2px solid transparent;outline:0}
.box input:focus,.box select:focus{border-color:#F3AB01}
.logo{background:#fff;border-radius:26px;padding:10px 14px;border:3px solid #F3AB01;box-shadow:0 0 0 4px #ffffff2e,0 10px 26px #000a,0 0 40px #F3AB0166;animation:pop 3.5s ease-in-out infinite}
@keyframes pop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1{font-size:clamp(34px,7vw,58px);line-height:1.3;padding:.1em .15em .3em;margin:-.1em 0 -.2em;background:linear-gradient(180deg,#fff6bf 10%,#F3AB01 90%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #7a4a00) drop-shadow(0 8px 14px #000a)}
.ribbon{display:inline-block;background:linear-gradient(90deg,#013699,#0a56d6,#013699);border:2px solid #F3AB01;border-radius:999px;padding:5px 22px;font-weight:bold;font-size:clamp(15px,3vw,20px);box-shadow:0 4px 12px #0007}
.tag{font-size:clamp(16px,3.2vw,22px);font-weight:bold;text-shadow:0 2px 6px #000}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:460px}
.chip{background:rgba(1,24,86,.7);border:1.5px solid rgba(243,171,1,.55);border-radius:999px;padding:4px 11px;font-size:clamp(13px,2.6vw,16px);font-weight:bold;box-shadow:0 2px 8px #0006}
button{position:relative;overflow:hidden;background:linear-gradient(180deg,#ffe07a,#F3AB01 55%,#d98f00);color:#3a2400;border:3px solid #fff;border-radius:999px;padding:14px 48px;box-shadow:0 6px 0 #a56a00,0 12px 22px #000a;text-shadow:0 1px 0 #fff8}
button::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #a56a00,0 5px 10px #000a}
button.g{background:linear-gradient(180deg,#5ee38f,#16a34a 55%,#0b7a3b);color:#fff;border-color:#fff;box-shadow:0 6px 0 #075c2b,0 12px 22px #000a;text-shadow:0 2px 0 #0a5a2b}
#mute{background:rgba(1,26,90,.72);border:2px solid rgba(243,171,1,.7);border-radius:16px;box-shadow:0 3px 10px #0006;padding:4px 12px;font-size:20px;color:#fff;text-shadow:none}
#mute::after{display:none}
.fl{position:absolute;pointer-events:none;opacity:.85;animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 0 8px #ffd54a)}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(22deg)}}
.big{text-shadow:0 0 24px #F3AB01aa,0 4px 0 #7a4a00;animation:bump 1.6s ease-in-out infinite}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.st div{background:rgba(255,255,255,.1);border:1px solid rgba(243,171,1,.4);border-radius:12px}

.scr>*{flex-shrink:0}
.scr>.fl{flex-shrink:1}
.logo{max-height:clamp(70px,15vh,150px)}
@media (max-height:700px){
  .scr{gap:8px}
  h1{font-size:clamp(28px,5.5vw,40px)}
  .box{padding:10px}
  .box select,.box input{padding:8px;margin:3px 0;font-size:16px}
  button{padding:10px 40px}
  .ribbon{padding:3px 16px}
}
</style>
</head>

<script>
/* ===== إعدادات سهلة التعديل ===== */
const SCHOOL_NAME = "مدارس قادة النخبة";
const GAME_TIME = 60;                // مدة اللعبة بالثواني
const LEVEL_EVERY = 9;               // كل كم ثانية يرتفع المستوى
/* ================================ */

const $=id=>document.getElementById(id);
$('school').textContent=SCHOOL_NAME;
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,S=1,st=null,raf=0,bg=[];
const FONT='Tahoma, Arial, sans-serif';

/* ---------- الصوت ---------- */
let AC=null,muted=false,musicOn=false,beat=0,mt=0,curLevel=1;
function initAudio(){
  try{ if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)()} if(AC.state==='suspended')AC.resume() }catch(e){}
}
function tone(f,d,type,vol,when,slide){
  if(!AC||muted)return;
  const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);
}
const sfx={
  star(c){tone(600+Math.min(c,14)*55,.1,'triangle',.28)},
  gold(){[880,1100,1320,1760].forEach((f,i)=>tone(f,.14,'square',.1,i*.06))},
  heart(){tone(520,.12,'sine',.28);tone(780,.22,'sine',.28,.1)},
  clock(){tone(1000,.07,'square',.1);tone(1300,.1,'square',.1,.09)},
  hit(){tone(220,.35,'sawtooth',.3,0,-150)},
  level(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,'triangle',.3,i*.08))},
  over(){[523,440,349,262].forEach((f,i)=>tone(f,.28,'triangle',.3,i*.2))},
  win(){[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.3,i*.12))}
};
let NB=null;
function noiseBuf(){if(NB||!AC)return NB;NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB}
function lead(f,d,vol,when,cut){
  if(!AC||muted)return;const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(),o2=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sawtooth';o2.type='square';o.frequency.value=f;o2.frequency.value=f*1.006;
  fl.type='lowpass';fl.frequency.setValueAtTime(cut||2600,t);fl.frequency.exponentialRampToValueAtTime(500,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(AC.destination);
  o.start(t);o2.start(t);o.stop(t+d+.02);o2.stop(t+d+.02);
}
function kick(vol){tone(160,.16,'sine',vol,0,-120)}
function noise(d,vol,hp){
  if(!AC||muted)return;const nb=noiseBuf();if(!nb)return;const t=AC.currentTime;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+.02);
}

function music(){
  if(!musicOn)return;
  const L=curLevel,bpm=124+L*7,d=60/bpm/4;
  const bar=Math.floor(beat/16)%4,step=beat%16;
  if(step%4===0)kick(.35);
  if(step===4||step===12){noise(.12,.22,1800);}
  if(step%2===1||L>=3)noise(.04,L>=3&&step%2===0?.05:.09,7000);
  // باس
  if(step%2===0)tone(BASS[bar]*(step%8===6?2:1),d*1.7,'sawtooth',.11);
  // أربيجيو
  if(step%2===0){tone(ARP[bar][(step/2)%4],d*1.6,'triangle',.07);}
  // لحن رئيسي
  const h=HOOK[bar][Math.floor(step/2)];
  if(step%2===0&&h>=0)lead(ARP[bar][h]*(L>=4?2:1),d*3.2,.06,0,2400+L*300);
  beat++;mt=setTimeout(music,d*1000);
}
function startMusic(){stopMusic();musicOn=true;beat=0;music()}
function stopMusic(){musicOn=false;clearTimeout(mt)}
function toggleMute(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊'}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

function fit(){
  const dpr=window.devicePixelRatio||1;
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.max(.75,Math.min(1.7,Math.min(W,H*.8)/430));
  bg=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,p:Math.random()*6}));
  buildScene();if(st)st.x=st.tx=Math.max(40,Math.min(W-40,st.x));
}
function menuBg(){

/* ---------- رسم الأشكال ---------- */
let bgc=null;
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+c+','+a+')');g.addColorStop(1,'rgba('+c+',0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function starPath(c,x,y,r,rot){c.beginPath();for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,rr=i%2?r*.5:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()}
function star(x,y,r,c1,c2,rot,gl,o){
  if(gl)glow(x,y,r*2,gl,.55);
  const g=ctx.createLinearGradient(x,y-r,x,y+r);g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.lineJoin='round';starPath(ctx,x,y,r,rot||0);ctx.fillStyle=g;ctx.fill();
  ctx.lineWidth=Math.max(2,r*.14);ctx.strokeStyle=o||'rgba(255,255,255,.75)';ctx.stroke();
  ctx.globalAlpha=.4;starPath(ctx,x,y,r*.5,rot||0);ctx.fillStyle='#fff';ctx.fill();ctx.globalAlpha=1;
}
function heart(x,y,r){
  glow(x,y,r*2.2,'255,70,100',.5);
  const g=ctx.createLinearGradient(x,y-r,x,y+r);g.addColorStop(0,'#ff8fa0');g.addColorStop(1,'#d60f2e');
  ctx.beginPath();ctx.moveTo(x,y+r*.9);ctx.bezierCurveTo(x-r*1.7,y-r*.2,x-r*.7,y-r*1.3,x,y-r*.45);
  ctx.bezierCurveTo(x+r*.7,y-r*1.3,x+r*1.7,y-r*.2,x,y+r*.9);ctx.fillStyle=g;ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.ellipse(x-r*.55,y-r*.45,r*.28,r*.16,-.7,0,7);ctx.fill();
}
function cloud(x,y,s){
  glow(x,y,34*s,'255,70,70',.28);
  const g=ctx.createLinearGradient(x,y-20*s,x,y+16*s);g.addColorStop(0,'#9aa5bd');g.addColorStop(1,'#4b5573');
  ctx.fillStyle=g;ctx.beginPath();
  ctx.arc(x-16*s,y+3*s,14*s,0,7);ctx.arc(x-2*s,y-8*s,18*s,0,7);ctx.arc(x+16*s,y+1*s,15*s,0,7);ctx.arc(x,y+6*s,15*s,0,7);ctx.fill();
  // وجه غاضب
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-7*s,y+1*s,4.6*s,0,7);ctx.arc(x+8*s,y+1*s,4.6*s,0,7);ctx.fill();
  ctx.fillStyle='#1b1f33';ctx.beginPath();ctx.arc(x-6*s,y+2*s,2.2*s,0,7);ctx.arc(x+7*s,y+2*s,2.2*s,0,7);ctx.fill();
  ctx.strokeStyle='#1b1f33';ctx.lineWidth=2.6*s;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(x-13*s,y-5*s);ctx.lineTo(x-3*s,y-1*s);ctx.moveTo(x+14*s,y-5*s);ctx.lineTo(x+4*s,y-1*s);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y+11*s,4*s,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
  // برق
  ctx.fillStyle='#ffe44d';ctx.beginPath();ctx.moveTo(x+2*s,y+14*s);ctx.lineTo(x-5*s,y+26*s);ctx.lineTo(x,y+26*s);ctx.lineTo(x-3*s,y+36*s);ctx.lineTo(x+7*s,y+22*s);ctx.lineTo(x+2*s,y+22*s);ctx.closePath();ctx.fill();
}
function clock(x,y,r){
  glow(x,y,r*2.3,'76,201,240',.5);
  const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,'#9cf0ff');g.addColorStop(1,'#1796cc');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle='#f4fcff';ctx.beginPath();ctx.arc(x,y,r*.72,0,7);ctx.fill();
  ctx.strokeStyle='#0d6f9c';ctx.lineWidth=2;ctx.lineCap='round';
  for(let i=0;i<4;i++){const a=i*Math.PI/2;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*r*.52,y+Math.sin(a)*r*.52);ctx.lineTo(x+Math.cos(a)*r*.64,y+Math.sin(a)*r*.64);ctx.stroke()}
  ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(x,y-r*.5);ctx.lineTo(x,y);ctx.lineTo(x+r*.34,y+r*.14);ctx.stroke();
}
function basket(x,y,s,pu){
  pu=pu||0;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,34*s,46*s,7*s,0,0,7);ctx.fill();
  ctx.scale(s*(1+.1*pu),s*(1-.14*pu));
  ctx.beginPath();ctx.moveTo(-40,-14);ctx.lineTo(40,-14);ctx.lineTo(29,24);ctx.quadraticCurveTo(0,32,-29,24);ctx.closePath();
  const g=ctx.createLinearGradient(0,-14,0,30);g.addColorStop(0,'#f0b863');g.addColorStop(1,'#9c5c1a');ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.clip();ctx.strokeStyle='rgba(90,48,10,.45)';ctx.lineWidth=2.5;
  for(let i=-60;i<60;i+=13){ctx.beginPath();ctx.moveTo(i,-14);ctx.lineTo(i+26,34);ctx.moveTo(i+26,-14);ctx.lineTo(i,34);ctx.stroke()}
  ctx.restore();
  ctx.beginPath();ctx.moveTo(-40,-14);ctx.lineTo(40,-14);ctx.lineTo(29,24);ctx.quadraticCurveTo(0,32,-29,24);ctx.closePath();
  ctx.lineWidth=2;ctx.strokeStyle='#6e3d0e';ctx.stroke();
  ctx.fillStyle='#5a3510';ctx.beginPath();ctx.ellipse(0,-14,42,9,0,0,7);ctx.fill();
  const rg=ctx.createLinearGradient(0,-23,0,-5);rg.addColorStop(0,'#ffd88a');rg.addColorStop(1,'#d9953f');
  ctx.beginPath();ctx.ellipse(0,-14,43,10,0,Math.PI,0);ctx.lineTo(37,-14);ctx.ellipse(0,-14,37,6,0,0,Math.PI);ctx.closePath();ctx.fillStyle=rg;ctx.fill();
  ctx.strokeStyle='#8a5a1c';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,-14,43,10,0,0,7);ctx.stroke();
  // نجمة ذهبية على السلة
  starPath(ctx,0,8,9,0);ctx.fillStyle='#ffe680';ctx.fill();ctx.strokeStyle='#b8850c';ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();
}
function palm(c,x,y,h,S){
  c.strokeStyle='#021750';c.lineCap='round';c.lineWidth=6*S;
  c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x-h*.12,y-h*.5,x+h*.1,y-h);c.stroke();
  const tx=x+h*.1,ty=y-h;c.lineWidth=4*S;
  for(let i=0;i<7;i++){const a=-Math.PI*.95+i*(Math.PI*.9/6),L=h*.42;
    c.beginPath();c.moveTo(tx,ty);c.quadraticCurveTo(tx+Math.cos(a)*L*.6,ty+Math.sin(a)*L*.6-L*.25,tx+Math.cos(a)*L,ty+Math.sin(a)*L+L*.28);c.stroke()}
}
function buildScene(){
  const dpr=window.devicePixelRatio||1;
  bgc=document.createElement('canvas');bgc.width=W*dpr;bgc.height=H*dpr;
  const c=bgc.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const sky=c.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#010d38');sky.addColorStop(.55,'#07307f');sky.addColorStop(1,'#1c62d6');
  c.fillStyle=sky;c.fillRect(0,0,W,H);
  // قمر
  const mx=W*.84,my=H*.15,mr=30*S;
  const mg=c.createRadialGradient(mx,my,mr*.5,mx,my,mr*3.2);mg.addColorStop(0,'rgba(255,240,180,.35)');mg.addColorStop(1,'rgba(255,240,180,0)');
  c.fillStyle=mg;c.beginPath();c.arc(mx,my,mr*3.2,0,7);c.fill();
  c.fillStyle='#fff3c4';c.beginPath();c.arc(mx,my,mr,0,7);c.fill();
  c.fillStyle='#0a2a77';c.beginPath();c.arc(mx+mr*.42,my-mr*.12,mr*.88,0,7);c.fill();
  // أفق المدينة
  const base=H*.8;let x=-10;
  while(x<W+10){
    const w=(16+Math.random()*30)*S,h=(40+Math.random()*(H*.2))*S*.7;
    c.fillStyle='rgba(6,30,100,.85)';c.fillRect(x,base-h,w,h+40);
    if(Math.random()<.3){c.fillRect(x+w*.4,base-h-14*S,w*.2,14*S)}
    c.fillStyle='rgba(243,171,1,.55)';
    for(let wy=base-h+8*S;wy<base-6*S;wy+=11*S)for(let wx=x+4*S;wx<x+w-5*S;wx+=8*S)if(Math.random()<.22)c.fillRect(wx,wy,3*S,4*S);
    x+=w+(2+Math.random()*6)*S;
  }
  // كثبان
  function dune(y0,amp,col,ph,rim){
    c.beginPath();c.moveTo(0,H);
    for(let i=0;i<=W;i+=6)c.lineTo(i,y0+Math.sin(i/(W*.17)+ph)*amp+Math.sin(i/(W*.07)+ph*2)*amp*.35);
    c.lineTo(W,H);c.closePath();c.fillStyle=col;c.fill();
    if(rim){c.strokeStyle='rgba(228,184,10,.55)';c.lineWidth=2;c.beginPath();
      for(let i=0;i<=W;i+=6){const yy=y0+Math.sin(i/(W*.17)+ph)*amp+Math.sin(i/(W*.07)+ph*2)*amp*.35;i?c.lineTo(i,yy):c.moveTo(i,yy)}c.stroke()}
  }
  dune(H*.86,12*S,'#0a2f87',1,true);
  palm(c,W*.1,H*.9,110*S,S);palm(c,W*.92,H*.9,90*S,S);palm(c,W*.18,H*.92,70*S,S);
  dune(H*.93,9*S,'#052060',3,true);
  c.fillStyle='#021a52';c.fillRect(0,H-12*S,W,14*S);
  c.fillStyle='#E4B80A';c.fillRect(0,H-13*S,W,2);
}
function txt(t,x,y,size,col,a){
  ctx.globalAlpha=a==null?1:a;ctx.font='bold '+size+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=4;ctx.strokeStyle='#0008';ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y);ctx.globalAlpha=1;
}

/* ---------- اللعبة ---------- */
function start(){
  initAudio();
  try{localStorage.setItem('pName',$('nm').value);localStorage.setItem('pGr',$('gr').selectedIndex);localStorage.setItem('pSc',$('sc').selectedIndex)}catch(e){}
  $('s1').classList.remove('on');$('s3').classList.remove('on');$('game').classList.add('on');
  fit();
  st={x:W/2,tx:W/2,items:[],parts:[],texts:[],score:0,lives:3,time:GAME_TIME,level:1,combo:0,maxCombo:0,
      last:performance.now(),spawn:.5,shake:0,banner:1.2,keys:{},elapsed:0};
  curLevel=1;startMusic();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function setX(e){
  if(!st)return;
  const r=cv.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  st.tx=Math.max(40*S,Math.min(W-40*S,cx));
  if(e.cancelable)e.preventDefault();
}
cv.addEventListener('touchstart',setX,{passive:false});
cv.addEventListener('touchmove',setX,{passive:false});
cv.addEventListener('mousemove',setX);
cv.addEventListener('mousedown',setX);
addEventListener('keydown',e=>{if(st){st.keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()}});
addEventListener('keyup',e=>{if(st)st.keys[e.key.toLowerCase()]=0});

function burst(x,y,c,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=80+Math.random()*180;
    st.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:.6+Math.random()*.4,c})}
}
function popText(t,x,y,c){st.texts.push({t,x,y,c,life:.9})}

function spawn(){
  const L=st.level,r=Math.random();
  const cloudP=Math.min(.42,.14+L*.06),clockP=.035,heartP=st.lives<3?.04:0,goldP=.1;
  let type='star';
  if(r<cloudP)type='cloud';
  else if(r<cloudP+clockP)type='clock';
  else if(r<cloudP+clockP+heartP)type='heart';
  else if(r<cloudP+clockP+heartP+goldP)type='gold';
  const mk=(y)=>{
    const base=(170+L*60)*S;
    const it={x:(30+Math.random()*(W-60)),y:y,v:base*(.8+Math.random()*.55),type,t:Math.random()*6,sway:(L>=2&&Math.random()<.45)?(30+L*10)*S:0};
    if(L>=3&&Math.random()<.25){it.v*=1.55;it.fast=1}
    return it;
  };
  st.items.push(mk(-30*S));
  if(L>=4&&Math.random()<.4)st.items.push(Object.assign(mk(-110*S),{type:Math.random()<.5?'cloud':'star'}));
  if(L>=6&&Math.random()<.4)st.items.push(Object.assign(mk(-190*S),{type:'cloud'}));
  st.spawn=Math.max(.17,.6-L*.08)*(.8+Math.random()*.4);
}

function loop(now){
  const dt=Math.min(.05,(now-st.last)/1000);st.last=now;
  st.time-=dt;st.elapsed+=dt;st.spawn-=dt;st.banner-=dt;
  const lvl=1+Math.floor(st.elapsed/LEVEL_EVERY);
  if(lvl>st.level){st.level=lvl;curLevel=lvl;st.banner=1.4;sfx.level();popText('سرعة أعلى!',W/2,H*.38,'#ffd84a')}
  // تحكم الكيبورد
  const k=st.keys;
  if(k.arrowleft||k.a)st.tx-=600*S*dt;
  if(k.arrowright||k.d)st.tx+=600*S*dt;
  st.tx=Math.max(40*S,Math.min(W-40*S,st.tx));
  st.x+=(st.tx-st.x)*Math.min(1,dt*20);
  if(st.spawn<=0)spawn();

  // خلفية
  ctx.save();
  if(st.shake>0){st.shake-=dt;ctx.translate((Math.random()-.5)*14,(Math.random()-.5)*14)}
  ctx.fillStyle='#012a78';ctx.fillRect(-20,-20,W+40,H+40);if(bgc)ctx.drawImage(bgc,0,0,W,H);
  ctx.fillStyle='#fff';
  for(const b of bg){ctx.globalAlpha=.3+.3*Math.sin(now/500+b.p);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  

  const by=H-62*S;
  const bs=1-Math.min(.25,(st.level-1)*.05);st.pulse=Math.max(0,(st.pulse||0)-dt*5);basket(st.x,by,S*bs,st.pulse);

  for(const it of st.items){
    it.y+=it.v*dt;it.t+=dt*3;
    if(it.sway)it.x+=Math.cos(it.t)*it.sway*dt*2;
    it.x=Math.max(20,Math.min(W-20,it.x));
    const R=20*S;
    if(it.fast){const tg=ctx.createLinearGradient(0,it.y-90*S,0,it.y);tg.addColorStop(0,'rgba(255,216,74,0)');tg.addColorStop(1,'rgba(255,216,74,.7)');ctx.fillStyle=tg;ctx.fillRect(it.x-4*S,it.y-90*S,8*S,90*S)}
    const rot=it.t*.4;
    if(it.type==='star')star(it.x,it.y,R,'#fff09a','#ffb300',rot,'255,214,70');
    else if(it.type==='gold')star(it.x,it.y,R*1.3,'#ffe27a','#ff6f00',rot,'255,150,30','#fff');
    else if(it.type==='heart')heart(it.x,it.y,R*.8);
    else if(it.type==='clock')clock(it.x,it.y,R*.85);
    else cloud(it.x,it.y,S*1.15);
    // التقاط
    if(!it.d&&Math.abs(it.x-st.x)<(44*S*bs+R*.5)&&it.y+R*.6>by-26*S&&it.y-R*.6<by+14*S){
      it.d=1;st.pulse=1;
      if(it.type==='star'||it.type==='gold'){
        st.combo++;st.maxCombo=Math.max(st.maxCombo,st.combo);
        const mult=Math.min(4,1+Math.floor(st.combo/5));
        const pts=(it.type==='gold'?3:1)*mult;st.score+=pts;
        if(it.type==='gold'){sfx.gold();burst(it.x,it.y,'#ff9f1c',16)}else{sfx.star(st.combo);burst(it.x,it.y,'#ffd84a',8)}
        popText('\u200E+'+pts,it.x,it.y-20*S,it.type==='gold'?'#ff9f1c':'#ffd84a');
        if(st.combo>0&&st.combo%5===0)popText('كومبو x'+mult+' 🔥',W/2,H*.3,'#ff7a1a');
      }else if(it.type==='heart'){
        if(st.lives<3)st.lives++;sfx.heart();burst(it.x,it.y,'#ff3b4e',10);popText('+حياة',it.x,it.y-20*S,'#ff6b7a');
      }else if(it.type==='clock'){
        st.time+=4;sfx.clock();burst(it.x,it.y,'#4cc9f0',10);popText('\u200E+4\u200E ثواني',it.x,it.y-20*S,'#4cc9f0');
      }else{
        st.lives--;st.combo=0;st.shake=.3;sfx.hit();buzz(120);burst(it.x,it.y,'#8a94a6',12);popText('آخ!',it.x,it.y-20*S,'#ff6b6b');
      }
    }
    if(!it.d&&it.y>H+30&&(it.type==='star'||it.type==='gold'))st.combo=0;
  }
  st.items=st.items.filter(i=>!i.d&&i.y<H+40);

  // جسيمات ونصوص
  for(const p of st.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life*1.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,(2+p.life*4)*S,0,7);ctx.fill()}
  ctx.globalAlpha=1;st.parts=st.parts.filter(p=>p.life>0);
  for(const t of st.texts){t.y-=50*dt;t.life-=dt;txt(t.t,t.x,t.y,26*S,t.c,Math.min(1,t.life*2))}
  st.texts=st.texts.filter(t=>t.life>0);
  if(st.banner>0)txt('المستوى '+st.level,W/2,H*.22,48*S,'#fff',Math.min(1,st.banner));
  if(st.combo>=5)txt('🔥 '+st.combo,W/2,H-100*S,22*S,'#ff9f1c',.9);
  ctx.restore();

  $('t').textContent='⏱ '+Math.max(0,Math.ceil(st.time));
  $('p').textContent='⭐ '+st.score;
  $('lv').textContent='المستوى '+st.level;
  $('l').textContent='❤️'.repeat(Math.max(0,st.lives));
  if(st.time<=0||st.lives<=0)return end();
  raf=requestAnimationFrame(loop);
}

function end(){
  stopMusic();
  const nm=$('nm').value.trim()||'بطل',sc=st.score;
  const good=sc>=60;
  $('who').textContent=nm;$('fin').textContent=sc;
  $('cls').textContent=$('gr').value+' '+$('sc').value;
  $('rl').textContent=st.level;$('rc').textContent=st.maxCombo;
  $('ttl').textContent=good?'أسطورة النجوم! 🏆':'أحسنت يا بطل! 🎉';
  $('msg').textContent=sc>=80?'رقم خرافي! 🏆':sc>=50?'ممتاز! 🌟':sc>=25?'جميل، حاول تكسر رقمك!':'بداية حلوة، جرّب مرة ثانية 💪';
  try{const b=+localStorage.getItem('bestScore')||0;if(sc>b)localStorage.setItem('bestScore',sc);$('best').textContent='🏆 أفضل نتيجة لك: '+Math.max(b,sc)}catch(e){}
  good?sfx.win():sfx.over();
  st=null;
  $('game').classList.remove('on');$('s3').classList.add('on');
}

menuBg();
// استرجاع آخر بيانات
try{
  $('nm').value=localStorage.getItem('pName')||'';
  $('gr').selectedIndex=+localStorage.getItem('pGr')||0;
  $('sc').selectedIndex=+localStorage.getItem('pSc')||0;
  const b=localStorage.getItem('bestScore');if(b)$('best').textContent='🏆 أفضل نتيجة لك: '+b;
}catch(e){}
</script>
</body>
</html>
